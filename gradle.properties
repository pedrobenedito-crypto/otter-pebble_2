# Memory for the Minecraft decompilation step.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# Recommended Forge build for 1.20.1
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## GeckoLib (animation library, required at runtime)
geckolib_version=4.8.2
geckolib_version_range=[4.8.2,)

## Mod
mod_id=otterpebble
mod_name=Otter & the Pebble
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.huuda.otterpebble
mod_authors=HUUDA
mod_description=A small river companion. A pup chooses your offer, the bond stays as it grows.\nFollow and Wait, tool rescue from the water, chirps, belly slides, grooming, learning by watching, pebble play and paired floats.
